<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <script src="./scripts.js" defer></script>
    <title>Jokenpô</title>
</head>

<body>
    <div class="container">
        <h1>JokenPô</h1>
        <div class="buttons">
            <button id="rock">&#x1F44A;</button>
            <button id="paper">&#x1f590;</button>
            <button id="scissors">&#x270c;</button>
        </div>
        <p class="your-score">Sua Pontuação: <span>0</span></p>
        <p class="machine-score">Pontuação da máquina: <span>0</span></p>
        <input class="result" placeholder="Resultado" disabled></input>
        <button class="reset">Reset</button>
    </div>
</body>

</html>
